<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15"/></filter><style>.h{font:700 18px Arial,sans-serif;fill:#0f172a}.t{font:15px Arial,sans-serif;fill:#334155}.sm{font:700 14px Arial,sans-serif;fill:#475569}.e{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#a)}.er{stroke:#dc2626}.b{stroke-width:3;filter:url(#s)}</style></defs>
<rect width="2000" height="1300" fill="#f8fafc"/><text x="1000" y="54" text-anchor="middle" style="font:700 38px Arial;fill:#172554">AI Request Triage — Technical Conditional Graph</text><text x="1000" y="88" text-anchor="middle" style="font:19px Arial;fill:#475569">API gates → LangGraph state transitions → deterministic guardrails → persistence → human review</text>

<!-- API admission flow -->
<path class="e" d="M180 170H250"/><path class="e" d="M460 170H515"/><path class="e" d="M655 170H720"/><path class="e er" d="M585 220V285"/><path class="e" d="M880 170H940"/><path class="e" d="M800 225V285"/><path class="e" d="M1080 170H1150"/><path class="e er" d="M1320 170H1460V322H1580"/><path class="e" d="M1235 225V390H1210V440"/>
<ellipse class="b" cx="110" cy="170" rx="70" ry="42" fill="#dbeafe" stroke="#2563eb"/><text class="h" x="110" y="165" text-anchor="middle">POST</text><text class="t" x="110" y="188" text-anchor="middle">/v1/triage</text>
<rect class="b" x="250" y="120" width="210" height="100" rx="16" fill="#e0e7ff" stroke="#4f46e5"/><text class="h" x="355" y="157" text-anchor="middle">API admission</text><text class="t" x="355" y="185" text-anchor="middle">payload + API key</text><text class="t" x="355" y="207" text-anchor="middle">correlation ID</text>
<polygon class="b" points="585,115 655,170 585,225 515,170" fill="#fef3c7" stroke="#d97706"/><text class="h" x="585" y="165" text-anchor="middle">Rate</text><text class="t" x="585" y="187" text-anchor="middle">allowed?</text><text class="sm" x="602" y="255">NO</text>
<rect class="b" x="510" y="285" width="150" height="70" rx="14" fill="#fecaca" stroke="#b91c1c"/><text class="h" x="585" y="315" text-anchor="middle">429</text><text class="t" x="585" y="340" text-anchor="middle">rate limited</text><text class="sm" x="675" y="160">YES</text>
<polygon class="b" points="800,115 880,170 800,225 720,170" fill="#fef3c7" stroke="#d97706"/><text class="h" x="800" y="161" text-anchor="middle">Existing</text><text class="t" x="800" y="184" text-anchor="middle">idempotency key?</text><text class="sm" x="820" y="255">YES</text><text class="sm" x="895" y="160">NO</text>
<rect class="b" x="725" y="285" width="150" height="70" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="h" x="800" y="315" text-anchor="middle">200 Replay</text><text class="t" x="800" y="340" text-anchor="middle">durable result</text>
<rect class="b" x="940" y="120" width="140" height="100" rx="16" fill="#ccfbf1" stroke="#0f766e"/><text class="h" x="1010" y="157" text-anchor="middle">SANITIZE</text><text class="t" x="1010" y="184" text-anchor="middle">redact PII</text><text class="t" x="1010" y="207" text-anchor="middle">detect injection</text>
<polygon class="b" points="1235,115 1320,170 1235,225 1150,170" fill="#fef3c7" stroke="#d97706"/><text class="h" x="1235" y="162" text-anchor="middle">Injection</text><text class="t" x="1235" y="185" text-anchor="middle">detected?</text><text class="sm" x="1340" y="160">YES</text><text class="sm" x="1248" y="260">NO</text>
<rect class="b" x="1580" y="270" width="230" height="105" rx="16" fill="#fee2e2" stroke="#dc2626"/><text class="h" x="1695" y="305" text-anchor="middle">ISOLATE REQUEST</text><text class="t" x="1695" y="332" text-anchor="middle">Other · Low · Client Success</text><text class="t" x="1695" y="355" text-anchor="middle">prompt_injection risk flag</text>

<!-- Analysis / repair -->
<path class="e" d="M1210 495H1300"/><path class="e" d="M1440 495H1510"/><path class="e" d="M1580 550V590H1380V550"/><path class="e er" d="M1650 495H1720"/><path class="e er" d="M1810 545V670H1170"/><path class="e" d="M1370 440V410H1115V670"/>
<rect class="b" x="1115" y="440" width="190" height="110" rx="16" fill="#ccfbf1" stroke="#0f766e"/><text class="h" x="1210" y="475" text-anchor="middle">ANALYSE AGENT</text><text class="t" x="1210" y="503" text-anchor="middle">Ollama · temp 0</text><text class="t" x="1210" y="528" text-anchor="middle">schema-bound JSON</text>
<polygon class="b" points="1370,440 1440,495 1370,550 1300,495" fill="#fef3c7" stroke="#d97706"/><text class="h" x="1370" y="489" text-anchor="middle">Schema</text><text class="t" x="1370" y="512" text-anchor="middle">valid?</text><text class="sm" x="1455" y="485">NO</text><text class="sm" x="1387" y="580">RETRY</text>
<rect class="b" x="1510" y="450" width="140" height="90" rx="14" fill="#fef3c7" stroke="#d97706"/><text class="h" x="1580" y="485" text-anchor="middle">REPAIR</text><text class="t" x="1580" y="513" text-anchor="middle">one retry</text>
<rect class="b" x="1720" y="450" width="180" height="95" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="h" x="1810" y="483" text-anchor="middle">FALLBACK</text><text class="t" x="1810" y="510" text-anchor="middle">if retry/LLM fails</text><text class="t" x="1810" y="532" text-anchor="middle">deterministic decision</text><text class="sm" x="1658" y="485">FAILS</text><text class="sm" x="1300" y="427">YES</text>

<!-- Validation and draft branching -->
<path class="e" d="M1115 725H1200"/><path class="e er" d="M1280 670V625H1510"/><path class="e er" d="M1360 725H1510"/><path class="e" d="M1280 780V835H1510"/>
<rect class="b" x="995" y="670" width="225" height="110" rx="16" fill="#fef3c7" stroke="#d97706"/><text class="h" x="1107" y="705" text-anchor="middle">VALIDATE POLICY</text><text class="t" x="1107" y="733" text-anchor="middle">category · priority · owner</text><text class="t" x="1107" y="758" text-anchor="middle">deterministic corrections</text>
<polygon class="b" points="1280,670 1360,725 1280,780 1200,725" fill="#fef3c7" stroke="#d97706"/><text class="h" x="1280" y="718" text-anchor="middle">Draft</text><text class="t" x="1280" y="741" text-anchor="middle">branch?</text>
<rect class="b" x="1510" y="585" width="220" height="80" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="h" x="1620" y="617" text-anchor="middle">INJECTION TEMPLATE</text><text class="t" x="1620" y="643" text-anchor="middle">no model call</text><text class="sm" x="1380" y="615">INJECTION</text>
<rect class="b" x="1510" y="685" width="220" height="85" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="h" x="1620" y="717" text-anchor="middle">SECURITY TEMPLATE</text><text class="t" x="1620" y="743" text-anchor="middle">privacy / access control</text><text class="sm" x="1380" y="712">SECURITY</text>
<rect class="b" x="1510" y="810" width="220" height="100" rx="14" fill="#ccfbf1" stroke="#0f766e"/><text class="h" x="1620" y="845" text-anchor="middle">DRAFT AGENT</text><text class="t" x="1620" y="873" text-anchor="middle">validated summary only</text><text class="t" x="1620" y="897" text-anchor="middle">structured response</text><text class="sm" x="1380" y="820">NORMAL</text>

<!-- Draft validation, persistence, response, review -->
<path class="e" d="M1510 860H1400"/><path class="e er" d="M1320 915V960H1110"/><path class="e" d="M1240 860H1050"/><path class="e" d="M1110 1000H1050"/><path class="e" d="M820 860H730"/><path class="e" d="M560 860H470"/><path class="e" d="M300 860H230"/>
<polygon class="b" points="1320,805 1400,860 1320,915 1240,860" fill="#fef3c7" stroke="#d97706"/><text class="h" x="1320" y="852" text-anchor="middle">Draft safe?</text><text class="t" x="1320" y="876" text-anchor="middle">schema + content</text><text class="sm" x="1200" y="850">YES</text><text class="sm" x="1335" y="945">NO</text>
<rect class="b" x="850" y="950" width="280" height="95" rx="14" fill="#fee2e2" stroke="#dc2626"/><text class="h" x="990" y="985" text-anchor="middle">REPAIR / SAFE FALLBACK</text><text class="t" x="990" y="1016" text-anchor="middle">owner-based acknowledgement</text>
<rect class="b" x="820" y="805" width="230" height="110" rx="16" fill="#ede9fe" stroke="#7c3aed"/><text class="h" x="935" y="840" text-anchor="middle">POSTGRESQL</text><text class="t" x="935" y="868" text-anchor="middle">request + redacted text</text><text class="t" x="935" y="892" text-anchor="middle">decision + draft + trace</text>
<ellipse class="b" cx="645" cy="860" rx="85" ry="48" fill="#dcfce7" stroke="#16a34a"/><text class="h" x="645" y="855" text-anchor="middle">201 Created</text><text class="t" x="645" y="882" text-anchor="middle">X-Request-ID</text>
<rect class="b" x="300" y="800" width="170" height="120" rx="16" fill="#dbeafe" stroke="#2563eb"/><text class="h" x="385" y="838" text-anchor="middle">STREAMLIT</text><text class="t" x="385" y="866" text-anchor="middle">result + trace</text><text class="t" x="385" y="891" text-anchor="middle">review controls</text>
<rect class="b" x="40" y="800" width="190" height="120" rx="16" fill="#dcfce7" stroke="#16a34a"/><text class="h" x="135" y="836" text-anchor="middle">HUMAN REVIEW</text><text class="t" x="135" y="864" text-anchor="middle">approve / correct / reject</text><text class="t" x="135" y="889" text-anchor="middle">409 if already reviewed</text>

<rect class="b" x="220" y="1110" width="1560" height="105" rx="18" fill="#f1f5f9" stroke="#475569"/><text class="h" x="1000" y="1148" text-anchor="middle">CROSS-CUTTING OBSERVABILITY AND RELIABILITY</text><text class="t" x="1000" y="1178" text-anchor="middle">Structured logs · correlation IDs · Prometheus counters and latency histograms · LangGraph node trace · token counts</text><text class="t" x="1000" y="1203" text-anchor="middle">timeouts · one repair retry · deterministic degradation · immutable AI decision and separate human outcome</text>
<rect x="140" y="1240" width="1720" height="42" rx="12" fill="#172554"/><text x="1000" y="1268" text-anchor="middle" style="font:700 17px Arial;fill:white">Diamonds are runtime decisions. Red paths are refusal, repair, or fallback paths. Every successful path converges on durable persistence.</text>
</svg>
